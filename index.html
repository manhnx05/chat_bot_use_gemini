<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trợ lý học toán lớp 4 - Cô Nguyễn Thị Ngọc Điệp</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

</head>

<body>

    <div class="chat-container">
        <div class="header">
            <h1>🎓 Trợ lý học toán lớp 4 🎓</h1>
            <p>👩‍🏫 Cô Nguyễn Thị Ngọc Điệp</p>
        </div>
        <div class="error-message" id="error-message">Lỗi: Không thể kết nối đến Gemini API. Vui lòng kiểm tra API key.
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="suggestions" id="suggestions-container"></div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Hỏi cô về bài toán lớp 4 nhé! 📚✨" />
            <button onclick="sendMessage()" title="Nhấn để gửi tin nhắn">GỬI 📤</button>
            <button onclick="startRecognition()" title="Chat bằng giọng nói">🎙️ Nói</button>
            <label for="image-input" class="custom-file-upload" title="Tải ảnh lên">📷 Ảnh</label>
            <input type="file" id="image-input" accept="image/*" onchange="handleImageUpload()"
                style="display: none;" />
        </div>
        <div class="preview-message" id="preview-message"></div>
    </div>

    <script src="/static/js/script.js"></script>
</body>

</html>
